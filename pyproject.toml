[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tetrisrl"
version = "0.1.0"
description = "Competitive reinforcement learning arena for TETR.IO Season 2 Tetris"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "TetrisRL contributors" }]
dependencies = [
    "numpy>=1.26",
    "torch>=2.2",
    "PyYAML>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "matplotlib>=3.8"]

[project.scripts]
tetrisrl = "tetrisrl.__main__:main"

[project.urls]
Documentation = "docs/ARCHITECTURE.md"

[tool.setuptools.packages.find]
include = ["tetrisrl*"]

[tool.setuptools.package-data]
"tetrisrl.dashboard" = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tetrisrl/tests"]
addopts = "-q"
markers = [
    "slow: long-running tests",
    "gpu: tests that require CUDA",
]
